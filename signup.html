<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | DermaCare</title>
  <script src="theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="theme.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <a class="brand" href="home.html">DermoCare</a>
    <h1>Create your account</h1>
    <p class="intro">Save your details for a smoother appointment booking experience.</p>
    <form id="signupForm">
      <label for="name">Full name
        <input id="name" name="name" type="text" autocomplete="name" required>
      </label>
      <label for="email">Email address
        <input id="email" name="email" type="email" autocomplete="email" required>
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <button type="submit">Create Account</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </main>
</body>
</html>
