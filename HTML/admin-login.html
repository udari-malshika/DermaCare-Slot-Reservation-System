<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | DermaCare</title>
  <script src="../JS/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/auth.css">
  <link rel="stylesheet" href="../CSS/theme.css">
  <script type="module" src="../JS/auth.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <a class="brand" href="home.html">DermoCare</a>
    <p class="eyebrow">STAFF PORTAL</p>
    <h1>Admin login</h1>
    <p class="intro">Manage appointments and registered patients from the clinic dashboard.</p>
    <form id="loginForm" data-role="admin">
      <label for="email">Admin email
        <input id="email" name="email" type="email" autocomplete="username" required>
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Open Dashboard</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
    <p class="switch"><a href="login.html">Return to customer login</a></p>
  </main>
</body>
</html>
