<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DermoCare Firebase Test</title>
</head>

<body>
  <h1>DermoCare Firebase Test</h1>

  <button id="saveBtn" disabled>Test Firebase Connection</button>
  <p id="status">Ready</p>

  <script type="module">
    import { auth, db } from "../JS/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const saveBtn = document.getElementById("saveBtn");
    const status = document.getElementById("status");

    let currentUser = null;
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      saveBtn.disabled = !user;
      status.textContent = user
        ? `Signed in as ${user.email}. Click to test Firestore.`
        : "Please sign in first to test the Firebase connection.";
    });

    saveBtn.addEventListener("click", async () => {
      if (!currentUser) return;

      status.textContent = "Checking Firestore connection...";
      saveBtn.disabled = true;
      try {
        await getDoc(doc(db, "users", currentUser.uid));
        status.textContent = "SUCCESS! Firebase Auth and Firestore are connected.";
      } catch (error) {
        console.error("Firebase connection test failed.", error);
        status.textContent = `FAILED: ${error.code || "unknown"} | ${error.message}`;
      }
      saveBtn.disabled = !currentUser;
    });
  </script>
</body>
</html>
