<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DermoCare Firebase Test</title>
</head>

<body>
  <h1>DermoCare Firebase Test</h1>

  <button id="saveBtn">Save Test Data</button>
  <p id="status">Ready</p>

  <script type="module">
    // Import Firebase Authentication and Firestore
    import { auth, db } from "./firebase.js";

    import {
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const saveBtn = document.getElementById("saveBtn");
    const status = document.getElementById("status");

    saveBtn.addEventListener("click", async () => {
      let currentStep = "Anonymous sign-in";

      status.textContent = "Connecting to Firebase...";
      saveBtn.disabled = true;

      try {
        // STEP 1: Sign in anonymously
        const credential = await signInAnonymously(auth);

        console.log("Anonymous login successful!");
        console.log("User UID:", credential.user.uid);

        status.textContent = "Login successful! Saving data...";

        // STEP 2: Save data to Firestore
        currentStep = "Firestore data save";

        const docRef = await addDoc(
          collection(db, "connection_test"),
          {
            message: "DermoCare Firebase Connected",
            status: "success",
            createdAt: new Date()
          }
        );

        console.log("Data saved successfully!");
        console.log("Document ID:", docRef.id);

        status.textContent =
          "SUCCESS! Data saved successfully. ID: " + docRef.id;

      } catch (error) {
        console.error("Failed step:", currentStep);
        console.error("Firebase Error Code:", error.code);
        console.error("Firebase Error Message:", error.message);

        status.textContent =
          "FAILED STEP: " + currentStep +
          " | Error Code: " + (error.code || "unknown") +
          " | Message: " + error.message;

      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
