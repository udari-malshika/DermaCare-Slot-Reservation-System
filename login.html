<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | DermaCare</title>
  <script src="theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="theme.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <a class="brand" href="home.html">DermoCare</a>
    <h1>Welcome back</h1>
    <p class="intro">Log in to keep your appointment details in one place.</p>
    <form id="loginForm">
      <label for="email">Email address
        <input id="email" name="email" type="email" autocomplete="email" required>
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
      </label>
      <button type="submit">Log In</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
    <p class="switch">New to DermoCare? <a href="signup.html">Create an account</a></p>
  </main>
</body>
</html>
