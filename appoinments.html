<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7650a6">
    <title>Book Appointment | DermaCare</title>
    <script>
        /* Apply saved theme before paint to avoid a flash */
        (function () {
            try {
                var t = localStorage.getItem("dermacareTheme") ||
                    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.dataset.theme = t;
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="./appointment.css">
    <script src="./appointment.js" defer></script>
</head>
<body>

<a class="skip-link" href="#wizardTop">Skip to booking</a>

<header class="topbar">
    <a href="home.html" class="brand">
        <span class="brand-icon">✿</span>
        <span>DermaCare<small>SKIN · HEALTH · CONFIDENCE</small></span>
    </a>
    <div class="topbar-actions">
        <button type="button" id="themeToggle" class="icon-button" aria-label="Switch to dark mode">☾</button>
        <a href="home.html" class="home-link">⌂ &nbsp;Home</a>
    </div>
</header>

<section class="hero">
    <div class="hero-content">
        <p class="eyebrow">YOUR SKIN DESERVES THE BEST</p>
        <h1>Book Your Appointment</h1>
        <p>Choose your treatment, date and preferred time in four easy steps.</p>
    </div>
    <div class="hero-decoration">Healthy Skin<br>Brighter You</div>
</section>

<main class="container">
    <noscript><p class="noscript">Please enable JavaScript to book an appointment.</p></noscript>

    <!-- STEP INDICATOR -->
    <nav aria-label="Booking progress">
        <ol class="stepper" id="stepper">
            <li><button type="button" data-step="1"><span class="step-num">1</span><span class="step-label">Treatment</span></button></li>
            <li><button type="button" data-step="2"><span class="step-num">2</span><span class="step-label">Date &amp; Time</span></button></li>
            <li><button type="button" data-step="3"><span class="step-num">3</span><span class="step-label">Your Details</span></button></li>
            <li><button type="button" data-step="4"><span class="step-num">4</span><span class="step-label">Confirm</span></button></li>
        </ol>
    </nav>

    <div class="booking-layout" id="wizardTop">

        <!-- WIZARD -->
        <section class="card wizard">

            <!-- STEP 1 -->
            <div class="panel" id="panel1" data-step="1">
                <div class="section-heading">
                    <span class="heading-icon">✚</span>
                    <div>
                        <h2 tabindex="-1">Choose Your Treatment</h2>
                        <p>Select the service you would like to book.</p>
                    </div>
                </div>
