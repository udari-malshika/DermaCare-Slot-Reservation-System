<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DermaCare Firebase Test</title>
</head>

<body>
  <h1>DermaCare Firebase Test</h1>

  <button id="saveBtn">Test Firebase Connection</button>
  <p id="status">Ready</p>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import {
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const saveBtn = document.getElementById("saveBtn");
    const status = document.getElementById("status");

    saveBtn.addEventListener("click", async () => {
      let currentStep = "Anonymous sign-in";

      status.textContent = "Connecting to Firebase...";
      saveBtn.disabled = true;

      try {
        // STEP 1: Sign in anonymously
        const credential = await signInAnonymously(auth);

        console.log("Anonymous login successful!");
        console.log("User UID:", credential.user.uid);

        status.textContent = "Login successful! Checking Firestore...";
        currentStep = "Firestore read";
        await getDoc(doc(db, "clinicSettings", "weeklySchedule"));
        status.textContent = "SUCCESS! Firebase Authentication and Firestore are connected.";

      } catch (error) {
        console.error("Failed step:", currentStep);
        console.error("Firebase Error Code:", error.code);
        console.error("Firebase Error Message:", error.message);

        if (error.code === "permission-denied") {
          status.textContent =
            "Authentication succeeded, but Firestore denied the read. Deploy the latest Firestore rules with " +
            "'firebase deploy --only firestore:rules', then test again.";
        } else {
          status.textContent =
            "FAILED STEP: " + currentStep +
            " | Error Code: " + (error.code || "unknown") +
            " | Message: " + error.message;
        }

      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
